appId: io.github.codex-router.control-center
productName: Codex Router
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
asar: true
electronFuses:
  # The packaged Electron executable intentionally runs the trusted installed
  # router entrypoints in Node mode; command-runner.mjs depends on this fuse.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
extraResources:
  - from: assets/icon.png
    to: icon.png
  # Include the complete account-module closure beside app.asar. Keep one
  # mapping per destination: extraResources copies matchers concurrently.
  - from: ../../src
    to: src
    filter:
      - "**/*"
  # External resource modules resolve these already-locked packages from
  # Resources/node_modules, outside app.asar and inside the signed bundle.
  - from: ../../node_modules/proper-lockfile
    to: node_modules/proper-lockfile
  - from: ../../node_modules/graceful-fs
    to: node_modules/graceful-fs
  - from: ../../node_modules/retry
    to: node_modules/retry
  - from: ../../node_modules/signal-exit
    to: node_modules/signal-exit
  # Read-only helpers used by the desktop UI must match the UI version even
  # when the shared router service is still owned by an older stable checkout.
  # They remain behind fixed IPC operations and are covered by the app's outer
  # signature; no renderer-controlled module path is accepted.
  - from: ../../src
    to: router-src
    filter:
      - "**/*"
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target: [dmg, zip]
linux:
  icon: assets/icon.png
  category: Development
  executableName: codex-router-control-center
  target: [AppImage]
win:
  icon: assets/icon.ico
  target: [nsis]
